name: publish-launcher

# Builds the Windows `AnimaLoraStudio.exe` and **commits it back to the repo**.
#
# Why the exe goes into git (binaries usually shouldn't): this fork's target users are
# people who "clone it and want to double-click it right away." Making them first dig
# through Releases for the attachment, or install PyInstaller and build it themselves,
# just adds back the step we're trying to save them. The exe is only ~7MB and rarely
# changes (only needs rebuilding when tools/launcher.py changes), so the cost is
# acceptable.
#
# Why this has to go through CI instead of a local build: PyInstaller produces an
# executable for the **host platform** — it can't cross-compile, so the Windows exe can
# only be built on Windows. This workflow is the only path for maintainers on
# Linux/macOS.
#
# Manually triggered (Actions -> publish-launcher -> Run workflow). Deliberately **not**
# hooked to push: PyInstaller's output isn't byte-for-byte reproducible, so rebuilding on
# every push would bloat the repo for no reason and would race with users' own commits on
# the same branch.
#
# The routine "does the exe still build" gate lives in build-launcher.yml (runs on every
# change to the launcher source, commits nothing).
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from and commit the exe back to"
        required: true
        default: master

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-python@v5
        with:
          # Build with the lowest supported version so the binary's runtime requirements
          # stay at the floor we claim to support.
          python-version: "3.10"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        run: python tools/build_launcher.py

      # Smoke test: the built binary must actually run and recognize itself inside the
      # repo. --check installs nothing. Committing an exe that builds fine but errors out
      # on a missing module at runtime is worse than not committing at all — the user
      # gets a "double-click does nothing" experience while the repo looks perfectly fine.
      - name: Smoke test
        run: |
          Copy-Item dist\AnimaLoraStudio.exe .\AnimaLoraStudio.exe -Force
          .\AnimaLoraStudio.exe --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f AnimaLoraStudio.exe
          # PyInstaller's output differs byte-for-byte every time (timestamps etc.), so
          # "there's a diff" can't be used to decide whether committing is meaningful —
          # --quiet here is only to skip the (theoretically impossible) case where
          # literally nothing changed, to avoid an empty commit.
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(launcher): rebuild AnimaLoraStudio.exe

          Built from tools/launcher.py by .github/workflows/publish-launcher.yml
          on a windows runner (PyInstaller cannot cross-compile). Smoke-tested
          with --check before committing."
          git push origin HEAD:${{ inputs.branch }}
