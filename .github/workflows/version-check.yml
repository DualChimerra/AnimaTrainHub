name: version-check

# Cross-file version drift gate. The v0.8.1 release forgot to bump package-lock.json,
# which meant npm install dirtied the lockfile at startup -> ZIP users' self-update
# preflight got stuck on a dirty tree. This workflow guards against the same regression.
#
# Runs two checks:
#   1. release_notes.yaml schema validation (validate)
#   2. version consistency across __init__.py / package.json / package-lock.json
#      (verify-versions)
on:
  pull_request:
  push:
    branches:
      - master
      - dev

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate release_notes.yaml schema
        run: python tools/bump_version.py validate
      - name: Verify version sync across __init__.py / package.json / lockfile
        run: python tools/bump_version.py verify-versions
