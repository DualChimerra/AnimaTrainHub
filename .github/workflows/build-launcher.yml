name: build-launcher

# 一键启动器（tools/launcher.py → AnimaLoraStudio.exe）的构建。
#
# PyInstaller 产出的是**宿主平台**的可执行文件，没法交叉编译 —— Windows 的 exe
# 只能在 windows runner 上出。Linux 的那份顺带一起出，方便本机 Linux 用户。
#
# 触发：
#   - 改到启动器源码的 PR / push → 只构建，作为「exe 还能编出来」的守门
#   - 打 tag（v*）→ 构建并把 exe 传成 release 附件
#   - 手动 workflow_dispatch
on:
  pull_request:
    paths:
      - "tools/launcher.py"
      - "tools/build_launcher.py"
      - ".github/workflows/build-launcher.yml"
  push:
    branches: [master, dev]
    paths:
      - "tools/launcher.py"
      - "tools/build_launcher.py"
      - ".github/workflows/build-launcher.yml"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AnimaLoraStudio-windows
            binary: dist/AnimaLoraStudio.exe
          - os: ubuntu-latest
            artifact: AnimaLoraStudio-linux
            binary: dist/AnimaLoraStudio
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 启动器只用标准库，但**它自己**得能在用户机器上跑。用 3.10 构建
          # 让产物的 glibc / API 需求落在我们声明支持的最低版本上。
          python-version: "3.10"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        run: python tools/build_launcher.py

      # 冒烟：产物必须能跑起来并认出自己在仓库里（--check 不装任何东西）。
      # 这一步能挡住"打包成功但一运行就缺模块"这类只有跑一次才暴露的问题。
      - name: Smoke test
        run: ${{ matrix.binary }} --check

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
