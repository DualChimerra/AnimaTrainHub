name: build-launcher

# Build for the one-click launcher (tools/launcher.py -> AnimaLoraStudio.exe).
#
# PyInstaller produces an executable for the **host platform** — it can't cross-compile,
# so the Windows exe can only be built on a windows runner. The Linux one is built
# alongside it for the convenience of local Linux users.
#
# Triggers:
#   - PR / push touching the launcher source -> build only, as a gate that "the exe
#     still builds"
#   - tag push (v*) -> build and attach the exe as a release asset
#   - manual workflow_dispatch
on:
  pull_request:
    paths:
      - "tools/launcher.py"
      - "tools/build_launcher.py"
      - ".github/workflows/build-launcher.yml"
  push:
    branches: [master, dev]
    paths:
      - "tools/launcher.py"
      - "tools/build_launcher.py"
      - ".github/workflows/build-launcher.yml"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AnimaLoraStudio-windows
            binary: dist/AnimaLoraStudio.exe
          - os: ubuntu-latest
            artifact: AnimaLoraStudio-linux
            binary: dist/AnimaLoraStudio
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The launcher itself only uses the standard library, but **it** still has to
          # run on the user's machine. Building with 3.10 keeps the produced binary's
          # glibc/API requirements at the minimum version we claim to support.
          python-version: "3.10"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        run: python tools/build_launcher.py

      # Smoke test: the built binary must actually run and recognize itself inside the
      # repo (--check installs nothing). This step catches "packaged fine but missing a
      # module at runtime" issues that only surface when you actually run it once.
      - name: Smoke test
        run: ${{ matrix.binary }} --check

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
