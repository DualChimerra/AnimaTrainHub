[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-peak-sampling"
version = "0.1.0"
description = "Configurable dual-peak timestep sampling for flow-matching training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["dual_peak_sampling"]
package-dir = {dual_peak_sampling = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
